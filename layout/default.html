
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <div class="site-top">
    <div class="site-identity">
      <a href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
      <span>{{ site.description }}</span>
    </div>

    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about.html' | relative_url }}">About</a>
      <a href="{{ '/research.html' | relative_url }}">Research</a>
      <a href="{{ '/publications.html' | relative_url }}">Publications</a>
      <a href="{{ '/contact.html' | relative_url }}">Contact</a>
    </nav>
  </div>

  {% if page.url == "/" or page.url == "/index.html" %}
    <header class="page-header"></header>
  {% endif %}

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ site.time | date: '%Y' }} Seni Senjaya
    | University of British Columbia
  </footer>

</body>
</html>
