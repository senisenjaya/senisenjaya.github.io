
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/about.html' | relative_url }}">About</a>
    <a href="{{ '/research.html' | relative_url }}">Research</a>
    <a href="{{ '/publications.html' | relative_url }}">Publications</a>
    <a href="{{ '/contact.html' | relative_url }}">Contact</a>
  </nav>

  <header class="page-header">
    <h1 class="project-name">{{ site.title }}</h1>
    <p class="project-tagline">{{ site.description }}</p>
  </header>

  <main class="main-content">
    {{ content }}

    <footer class="site-footer">
      &copy; {{ site.time | date: '%Y' }} {{ site.title }}
    </footer>
  </main>

</body>
</html>
